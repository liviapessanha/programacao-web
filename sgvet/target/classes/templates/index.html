<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
	 <meta charset="UTF-8">
	 <title>Home - SGVET</title>
	 
	 <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
	 <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
	 <link rel="stylesheet" th:href="@{/css-app/styles.css}">
	 <link rel="stylesheet" th:href="@{/css-app/home/styles.css}">
</head>
<body class="d-flex">
	<div th:replace="fragments/layout/navbar :: navbar"></div>
	<div class="principal p-4 w-100 d-flex flex-column align-items-center">

			<div class="row section-cards w-100">
				<div class="col-md-4">
					<div class="card card-resumo text-center shadow">
						<div class="card-body">
							<i class="bi bi-people-fill icon-resumo"></i>
							<h5 class="card-title">Clientes</h5>
							<p class="card-text fs-3" th:text="${totalClientes.size()}">0</p>
						</div>
					</div>
				</div>
				<div class="col-md-4">
					<div class="card card-resumo text-center shadow">
						<div class="card-body">
							<i class="bi bi-calendar-check icon-resumo"></i>
							<h5 class="card-title">Consultas</h5>
							<p class="card-text fs-3" th:text="${consultas.size()}">0</p>
						</div>
					</div>
				</div>
				<div class="col-md-4">
					<div class="card card-resumo text-center shadow">
						<div class="card-body">
							<i class="bi bi-x-circle icon-resumo"></i>
							<h5 class="card-title">Canceladas</h5>
							<p class="card-text fs-3" th:text="${totalCancelados.size()}">0</p>
						</div>
					</div>
				</div>
			</div>

			
			<div class="row" id="consultasProximas">
				<h4 class="mb-3">Próximas Consultas</h4>
				<div class="col-md-6 mb-3" th:each="consultaDaSemana : ${consultasDaSemana}">
					<div class="card shadow-sm">
						<div class="card-body">
							<h5 class="card-title" th:text="${consultaDaSemana.animal.nome}">Animal</h5>
							<p class="mb-1">
								<strong>Responsável:</strong> <span th:text="${consultaDaSemana.cliente.nome}">Cliente</span>
							</p>
							<p class="mb-1">
								<strong>Data:</strong>
								<span th:text="${#temporals.format(consultaDaSemana.dia, 'dd/MM/yyyy')}">Data</span>
								às <span th:text="${consultaDaSemana.hora}">Hora</span>
							</p>
							<p>
								<strong>Observações:</strong>
								<span th:text="${consultaDaSemana.observacoes}">Obs</span>
							</p>
						</div>
					</div>
				</div>
			</div>
		</div>
</body>
</html>
