<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
	 <meta charset="UTF-8">
	 <title>Home - SGVET</title>
	 
	 <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
	 <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
</head>
<body class="d-flex">
	<div th:replace="fragments/layout/navbar :: navbar"></div>
	
	<form th:action="@{/home}" th:object="${cliente}" method="post"> 
		<div> 
			<label for="nome">Nome:</label> 
			<input type="text" id="nome" th:field="*{nome}" th:errorclass="error" /> 
			<p th:if="${#fields.hasErrors('*{nome}')}" th:errors="*{nome}" class="error-message">Nome inválido</p> 
		</div> 
		<div> 
			<label for="email">Email:</label> 
			<textarea id="email" th:field="*{email}" th:errorclass="error"></textarea> 
			<p th:if="${#fields.hasErrors('*{email}')}" th:errors="*{email}" class="error-message">Email inválida</p> 
		</div> 
		<div> 
			<label for="senha">Senha:</label> 
			<input type="password" id="senha" th:field="*{senha}" /> 
		</div> 
		<div> 
			<label for="telefone">Telefone:</label> 
			<input type="number" id="telefone" th:field="*{telefone}" /> 
		</div>
		<div> 
			<label for="cpf">CPF:</label> 
			<input type="number" id="cpf" th:field="*{cpf}" /> 
		</div>
		<div> 
			<label for="cpf">CPF:</label> 
					<input type="number" id="cpf" th:field="*{cpf}" /> 
				</div>
		<button type="submit">Salvar</button> </form>
</body>
</html>
