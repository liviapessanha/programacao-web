<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
	 <meta charset="UTF-8">
	 <title>Cadastro Clientes - SGVET</title>
	 
	 <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
	 <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
	 <link rel="stylesheet" th:href="@{/css-app/styles.css}">
	 
	 <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</head>
<body class="d-flex">
	<div th:replace="fragments/layout/navbar :: navbar"></div>
	
	<div class="container d-flex flex-column align-items-center">
		<form th:action="@{/clientes}" method="get" class="d-flex gap-2 header-button w-100">
				<div class="d-flex gap-2">
				        <input type="text" name="nome" class="form-control input-buscar" placeholder="Buscar cliente por nome..." th:value="${param.nome}">
				        <button type="submit" class="btn btn-outline-primary button">Buscar</button>
			    </div>
				 <button type="button" class="btn btn-success button" data-bs-toggle="modal" data-bs-target="#novoClienteModal">
				         Novo
				  </button>
		</form>
	
		<table class="table table-bordered table-hover mb-4">
		      <thead class="table-primary">
		           <tr>
		               <th>Nome</th>
		               <th>Email</th>
		               <th>Telefone</th>
					   <th>Ações</th>
		           </tr>
		        </thead>
		     <tbody>
		           <tr th:each="cliente : ${clientes}">
		               <td th:text="${cliente.nome}">Nome</td>
		               <td th:text="${cliente.email}">Email</td>
		               <td th:text="${cliente.telefone}">Telefone</td>
					   <td class="d-flex gap-2">
						<button class="btn-icon delete-btn" type="button" th:attr="data-id=${cliente.id}">
							<i class="bi bi-trash text-dark fs-7 "></i>
						</button>
						<button 
							class="btn-icon edit-btn" 
							type="button"
							th:attr="data-id=${cliente.id},
									 data-nome=${cliente.nome},
									 data-email=${cliente.email},
									 data-senha=${cliente.senha},
									 data-telefone=${cliente.telefone},
									 data-cpf=${cliente.cpf},
									 data-endereco=${cliente.endereco}"
						>
							<i class="bi bi-pencil-fill text-dark fs-7"></i>
						</button>
					   </td>
		           </tr>
		     </tbody>
		 </table>
		 <div th:replace="fragments/modal/modalCliente :: modalCliente"></div>
	</div>
	
	<script th:src="@{/js-app/clientes/cliente.js}"></script>
</body>
</html>
