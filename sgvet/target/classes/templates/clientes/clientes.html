<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
	 <meta charset="UTF-8">
	 <title>Cadastro Clientes - SGVET</title>
	 
	 <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
	 <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
	 <link rel="stylesheet" th:href="@{/css-app/clientes/styles.css}">
	 
	 <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</head>
<body class="d-flex">
	<div th:replace="fragments/layout/navbar :: navbar"></div>
	
	<div class="container d-flex flex-column align-items-center">
		<form th:action="@{/clientes}" method="get" class="d-flex gap-2 header-button w-100">
				<div class="d-flex gap-2">
				        <input type="text" name="nome" class="form-control input-buscar" placeholder="Buscar cliente..." th:value="${param.nome}">
				        <button type="submit" class="btn btn-outline-primary button">Buscar</button>
			    </div>
				     <button type="button" class="btn btn-success button" data-bs-toggle="modal" data-bs-target="#novoClienteModal">
				         Novo
				     </button>
		</form>
	
		<table class="table table-bordered table-hover mb-4">
		      <thead class="table-primary">
		           <tr>
		               <th>Nome</th>
		               <th>Email</th>
		               <th>Telefone</th>
					   <th>Ações</th>
		           </tr>
		        </thead>
		     <tbody>
		           <tr th:each="cliente : ${clientes}">
		               <td th:text="${cliente.nome}">Nome</td>
		               <td th:text="${cliente.email}">Email</td>
		               <td th:text="${cliente.telefone}">Telefone</td>
					   <td class="d-flex gap-2">
						<button class="btn-icon delete-btn" type="button" th:attr="data-id=${cliente.id}">
							<i class="bi bi-trash text-dark fs-7 "></i>
						</button>
						<button 
							class="btn-icon edit-btn" 
							type="button"
							th:attr="data-id=${cliente.id},
									 data-nome=${cliente.nome},
									 data-email=${cliente.email},
									 data-senha=${cliente.senha},
									 data-telefone=${cliente.telefone},
									 data-cpf=${cliente.cpf},
									 data-endereco=${cliente.endereco}"
						>
							<i class="bi bi-pencil-fill text-dark fs-7"></i>
						</button>
					   </td>
		           </tr>
		     </tbody>
		 </table>
		 
		 
		 <div class="modal fade w-100" id="novoClienteModal" tabindex="-1" aria-hidden="true">
		         <div class="modal-dialog modal-dialog-centered">
		             <form id="formClienteModal" class="modal-content" th:action="@{/clientes}" th:object="${cliente}" method="post">
		                 <div class="modal-header">
		                     <h5 class="modal-title">Novo Cliente</h5>
		                     <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
		                 </div>
		                 <div class="modal-body">
							<input type="hidden" name="id" th:field="*{id}"/>
		                     <div class="mb-3">
		                         <label for="nome" class="form-label">Nome:</label>
		                         <input type="text" class="form-control" th:field="*{nome}" required/>
								 <p th:if="${#fields.hasErrors('*{nome}')}" th:errors="*{nome}" class="error-message">Nome inválido</p>
		                     </div>
		                     <div class="mb-3">
		                         <label for="email" class="form-label">Email:</label>
		                         <input type="email" class="form-control" th:field="*{email}" required/>
								 <p th:if="${#fields.hasErrors('*{email}')}" th:errors="*{email}" class="error-message">Email inválido</p>
		                     </div>
							 <div class="mb-3">
							 	 <label for="senha" class="form-label">Senha do Cliente:</label>
							 	 <input type="password" class="form-control" th:field="*{senha}" required/>
								 <p th:if="${#fields.hasErrors('*{senha}')}" th:errors="*{senha}" class="error-message">Senha inválido</p>
							 </div>
		                     <div class="mb-3">
		                         <label for="telefone" class="form-label">Telefone:</label>
		                         <input type="text" class="form-control" th:field="*{telefone}" required />
								 <p th:if="${#fields.hasErrors('*{telefone}')}" th:errors="*{telefone}" class="error-message">Telefone inválido</p>
		                     </div>
							 <div class="mb-3">
							 	<label for="cpf" class="form-label">CPF do Cliente:</label>
							 	<input type="text" class="form-control" th:field="*{cpf}" required/>
								<p th:if="${#fields.hasErrors('*{cpf}')}" th:errors="*{cpf}" class="error-message">CPF inválido</p>
							 </div>
							 <div class="mb-3">
							 	<label for="endereco" class="form-label">Endereço do Cliente:</label>
							 	<input type="text" class="form-control" th:field="*{endereco}" required/>
								<p th:if="${#fields.hasErrors('*{endereco}')}" th:errors="*{endereco}" class="error-message">Endereço inválido</p>
							 </div>
		                 </div>
		                 <div class="modal-footer">
		                     <button type="submit" id="modalSalvarBtn" class="btn btn-primary">Salvar</button>
		                     <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
		                 </div>
		            </form>
		         </div>
		  </div>
	</div>
	
	<script th:src="@{/js-app/clientes/cliente.js}"></script>
</body>
</html>
